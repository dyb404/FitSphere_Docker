services:
  mongo:
    image: mongo:8.0
    container_name: fitsphere-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/db_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MONGO_INITDB_DATABASE: fitsphere
    secrets:
      - db_user
      - db_password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fitsphere-app:latest
    container_name: fitsphere-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 8000
      DB_HOST: mongo
      DB_PORT: 27017
      DB_NAME: fitsphere
    secrets:
      - db_user
      - db_password
      - jwt_secret
    ports:
      - "80:8000"

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  mongo_data:
